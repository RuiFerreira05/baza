services:
  # Database Service
  db:
    image: postgres:16-alpine
    container_name: baza_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD} # Loaded from .env
      POSTGRES_DB: baza
    ports:
      - "5432:5432"
    volumes:
      - baza_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d baza" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baza_api_prod
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      SERVER_PORT: 8080
      SERVER_HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/baza
      PUBLIC_SERVER_URL: ${PUBLIC_SERVER_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      LOG_FILE_PATH: /app/logs/server.log
      AUDIT_LOG_FILE_PATH: /app/logs/audit.log
      FILE_UPLOAD_SERVICE: fs
      UPLOAD_DIR: /app/uploads/
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    volumes:
      - baza_logs:/app/logs
      - baza_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  baza_db_data:
  baza_logs:
  baza_uploads:
