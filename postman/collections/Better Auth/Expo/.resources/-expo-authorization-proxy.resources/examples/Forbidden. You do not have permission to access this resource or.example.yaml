$kind: http-example
name: Forbidden. You do not have permission to access this resource or to perform this action.
request:
  url: "{{baseUrl}}/expo-authorization-proxy?authorizationURL=string&oauthState="
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    authorizationURL: string
    oauthState: ""
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 3000
