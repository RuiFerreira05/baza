$kind: http-request
description: Redirects the user to the callback URL with the token
url: "{{baseUrl}}/reset-password/:token?callbackURL=string"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: callbackURL
    value: string
    description: The URL to redirect the user to reset their password
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
pathVariables:
  - key: token
    value: string
    description: The token to reset the password
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
examples: ./.resources/reset Password Callback.resources/examples
order: 19000
