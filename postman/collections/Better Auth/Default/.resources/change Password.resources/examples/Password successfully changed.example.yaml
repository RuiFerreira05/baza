$kind: http-example
request:
  url: "{{baseUrl}}/change-password"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "newPassword": "string",
        "currentPassword": "string",
        "revokeOtherSessions": true
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "user": {
          "id": "string",
          "email": "Wa6FEY4u63nW@xcFfawSNytBzHqjKMRcnTerQWLcNmpBvH.uwnu",
          "name": "string",
          "emailVerified": true,
          "createdAt": "1985-08-21T09:05:46.958Z",
          "updatedAt": "1993-03-13T10:14:37.027Z",
          "image": "https://Ze.rjyjwM"
        },
        "token": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "token": {
            "type": "string",
            "description": "New session token if other sessions were revoked"
          },
          "user": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "description": "The unique identifier of the user"
              },
              "email": {
                "type": "string",
                "description": "The email address of the user",
                "format": "email"
              },
              "name": {
                "type": "string",
                "description": "The name of the user"
              },
              "image": {
                "type": "string",
                "description": "The profile image URL of the user",
                "format": "uri"
              },
              "emailVerified": {
                "type": "boolean",
                "description": "Whether the email has been verified"
              },
              "createdAt": {
                "type": "string",
                "description": "When the user was created",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "description": "When the user was last updated",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "email",
              "name",
              "emailVerified",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "user"
        ]
      }
order: 1000
