$kind: http-example
request:
  url: "{{baseUrl}}/error"
  method: GET
  headers:
    - key: Accept
      value: text/html
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: text/html
  body:
    type: text
    content: string
    $type: |-
      {
        "type": "string",
        "description": "The HTML content of the error page"
      }
order: 1000
