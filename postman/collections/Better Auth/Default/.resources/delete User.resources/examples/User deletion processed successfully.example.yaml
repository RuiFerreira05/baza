$kind: http-example
request:
  url: "{{baseUrl}}/delete-user"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "callbackURL": "string",
        "password": "string",
        "token": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "Verification email sent"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "description": "Indicates if the operation was successful"
          },
          "message": {
            "type": "string",
            "enum": [
              "User deleted",
              "Verification email sent"
            ],
            "description": "Status message of the deletion process"
          }
        },
        "required": [
          "success",
          "message"
        ]
      }
order: 1000
