$kind: http-example
request:
  url: "{{baseUrl}}/get-access-token"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "providerId": "string",
        "accountId": "string",
        "userId": null
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "tokenType": "string",
        "idToken": "string",
        "accessToken": "string",
        "accessTokenExpiresAt": "1989-11-15T15:44:01.348Z"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "tokenType": {
            "type": "string"
          },
          "idToken": {
            "type": "string"
          },
          "accessToken": {
            "type": "string"
          },
          "accessTokenExpiresAt": {
            "type": "string",
            "format": "date-time"
          }
        }
      }
order: 1000
