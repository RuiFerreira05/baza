$kind: http-example
request:
  url: "{{baseUrl}}/revoke-session"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "token": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "status": true
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "status": {
            "type": "boolean",
            "description": "Indicates if the session was revoked successfully"
          }
        },
        "required": [
          "status"
        ]
      }
order: 1000
