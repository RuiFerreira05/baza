$kind: http-example
name: Too Many Requests. You have exceeded the rate limit. Try again later.
request:
  url: "{{baseUrl}}/revoke-sessions"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: "{}"
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 6000
