$kind: http-example
name: Forbidden. You do not have permission to access this resource or to perform this action.
request:
  url: "{{baseUrl}}/verify-email?token=string&callbackURL=string"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  queryParams:
    - key: token
      value: string
      description: The token to verify the email
    - key: callbackURL
      value: string
      description: The URL to redirect to after email verification
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 4000
