$kind: http-example
name: Bad Request. Usually due to missing parameters, or invalid parameters.
request:
  url: "{{baseUrl}}/account-info"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      }
order: 2000
