$kind: http-example
name: Too Many Requests. You have exceeded the rate limit. Try again later.
request:
  url: "{{baseUrl}}/sign-in/social"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "string",
        "callbackURL": "string",
        "newUserCallbackURL": null,
        "errorCallbackURL": "string",
        "disableRedirect": true,
        "idToken": {
          "token": "string",
          "nonce": "string",
          "accessToken": null,
          "refreshToken": null,
          "expiresAt": 5033.192215529226,
          "user": null
        },
        "requestSignUp": null,
        "loginHint": "string",
        "additionalData": "string"
      }
response:
  statusCode: 429
  statusText: Too Many Requests
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        }
      }
order: 6000
