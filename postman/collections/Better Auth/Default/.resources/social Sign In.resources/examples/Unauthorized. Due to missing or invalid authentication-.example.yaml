$kind: http-example
name: Unauthorized. Due to missing or invalid authentication.
request:
  url: "{{baseUrl}}/sign-in/social"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "provider": "string",
        "callbackURL": "string",
        "newUserCallbackURL": null,
        "errorCallbackURL": "string",
        "disableRedirect": true,
        "idToken": {
          "token": "string",
          "nonce": "string",
          "accessToken": null,
          "refreshToken": null,
          "expiresAt": 5033.192215529226,
          "user": null
        },
        "requestSignUp": null,
        "loginHint": "string",
        "additionalData": "string"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "message": "string"
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "message": {
            "type": "string"
          }
        },
        "required": [
          "message"
        ]
      }
order: 3000
