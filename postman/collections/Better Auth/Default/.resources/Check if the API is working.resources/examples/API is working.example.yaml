$kind: http-example
request:
  url: "{{baseUrl}}/ok"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: apiKeyCookie
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "ok": false
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "ok": {
            "type": "boolean",
            "description": "Indicates if the API is working"
          }
        },
        "required": [
          "ok"
        ]
      }
order: 1000
