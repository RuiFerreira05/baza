$kind: http-request
description: Verify the current user's password
url: "{{baseUrl}}/verify-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "password": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "password": {
          "type": "string",
          "description": "The password to verify"
        }
      },
      "required": [
        "password"
      ]
    }
examples: ./.resources/verify Password.resources/examples
order: 10000
