$kind: http-request
description: Reset the password for a user
url: "{{baseUrl}}/reset-password"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "string",
      "token": null
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "newPassword": {
          "type": "string",
          "description": "The new password to set"
        },
        "token": {
          "type": [
            "string",
            "null"
          ],
          "description": "The token to reset the password"
        }
      },
      "required": [
        "newPassword"
      ]
    }
examples: ./.resources/reset Password.resources/examples
order: 9000
