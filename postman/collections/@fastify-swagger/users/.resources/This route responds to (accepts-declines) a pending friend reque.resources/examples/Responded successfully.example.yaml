$kind: http-example
request:
  url: "{{baseUrl}}/v1/restricted/users/:username/friends/requests/:senderUsername"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
    senderUsername: string
  body:
    type: json
    content: |-
      {
        "status": "accepted"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "OK",
        "data": ""
      }
    $type: |-
      {
        "description": "Responded successfully",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "OK"
            ]
          }
        },
        "required": [
          "status",
          "data"
        ]
      }
order: 1000
