$kind: http-example
name: if the profile information was successfully fetched and converted to the expected format before sending the response
request:
  url: "{{baseUrl}}/v1/restricted/users/:username"
  method: GET
  headers:
    Accept: "*/*"
  pathVariables:
    username: string
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "OK",
        "data": {
          "username": "random_user123",
          "photo": "string",
          "description": "Hi, i'm random_user123!",
          "userId": "73bad37c-ceeb-d7e2-de77-edfe1d4185a9",
          "createdAt": "1987-03-25T15:57:19.822Z",
          "updatedAt": "2007-01-29T01:02:25.959Z"
        }
      }
    $type: |-
      {
        "description": "if the profile information was successfully fetched and converted to the expected format before sending the response",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "OK"
            ]
          },
          "data": {
            "type": "object",
            "title": "UserProfileDTO",
            "description": "Public user profile data, without sensitive information",
            "properties": {
              "username": {
                "type": "string",
                "example": "random_user123",
                "description": "username of user"
              },
              "photo": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "profile photo of the user"
                  },
                  {}
                ]
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "Profile description of user",
                    "example": "Hi, i'm random_user123!"
                  },
                  {}
                ]
              },
              "userId": {
                "type": "string",
                "example": "1y9889192bfb987",
                "description": "user ID (randomly given)",
                "format": "uuid"
              },
              "createdAt": {
                "type": "string",
                "description": "The date and time when the profile was created",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "description": "The date and time when the profile was last updated",
                "format": "date-time"
              }
            },
            "required": [
              "username",
              "photo",
              "description",
              "userId",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "status",
          "data"
        ]
      }
order: 1000
