$kind: http-example
name: if there was an error converting the updated profile data to the expected format before sending the response
request:
  url: "{{baseUrl}}/v1/restricted/users/:username"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
  body:
    type: json
    content: |-
      {
        "newUsername": "string",
        "newDescription": "string"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "ERROR",
        "error": {
          "type": "DeleteError",
          "message": "string"
        }
      }
    $type: |-
      {
        "description": "if there was an error converting the updated profile data to the expected format before sending the response",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ERROR"
            ]
          },
          "error": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "DeleteError"
                ]
              },
              "message": {
                "type": "string",
                "description": "A human readable error message"
              }
            },
            "required": [
              "type",
              "message"
            ]
          }
        },
        "required": [
          "status",
          "error"
        ]
      }
order: 3000
