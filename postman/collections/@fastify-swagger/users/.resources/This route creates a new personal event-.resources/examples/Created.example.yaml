$kind: http-example
request:
  url: "{{baseUrl}}/v1/restricted/users/:username/events"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "date": "2008-09-10",
        "startTime": "1971-09-25T12:36:13.188Z",
        "endTime": "1974-04-08T09:47:45.548Z",
        "repeat": "day",
        "public": true,
        "description": "string",
        "location": "string"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "OK",
        "data": {
          "id": "1y9889192bfb987",
          "username": "random_user123",
          "title": "Doctor Appointment",
          "description": "Annual checkup",
          "date": "1951-09-20",
          "location": "My house",
          "startTime": "1948-09-12T06:44:27.042Z",
          "endTime": "2007-03-07T12:33:10.924Z",
          "repeat": "string",
          "public": false,
          "createdAt": "2000-11-17T02:57:06.971Z",
          "updatedAt": "1969-01-26T17:50:38.602Z"
        }
      }
    $type: |-
      {
        "description": "Created",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "OK"
            ]
          },
          "data": {
            "type": "object",
            "title": "PersonalEventDTO",
            "description": "Personal event data.",
            "properties": {
              "id": {
                "type": "string",
                "example": "1y9889192bfb987",
                "description": "event ID (randomly given)"
              },
              "username": {
                "type": "string",
                "example": "random_user123",
                "description": "username of user who this event belongs to"
              },
              "title": {
                "type": "string",
                "example": "Doctor Appointment",
                "description": "event title"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "event description",
                    "example": "Annual checkup"
                  },
                  {}
                ]
              },
              "date": {
                "type": "string",
                "description": "The date of the event ",
                "format": "date"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "location where the event is going to take place",
                    "example": "My house"
                  },
                  {}
                ]
              },
              "startTime": {
                "type": "string",
                "description": "start time of the event",
                "format": "date-time"
              },
              "endTime": {
                "type": "string",
                "description": "end time of the event",
                "format": "date-time"
              },
              "repeat": {
                "type": "string",
                "description": "frequency which an event should be repeated in the calendar. Can only be on of these: day, week, month, year, never"
              },
              "public": {
                "type": "boolean",
                "description": "expresses if an event should be public to the user's friends"
              },
              "createdAt": {
                "type": "string",
                "description": "The date and time when the event was created",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "description": "The date and time when the event was last updated",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "username",
              "title",
              "description",
              "date",
              "location",
              "startTime",
              "endTime",
              "repeat",
              "public",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "status",
          "data"
        ]
      }
order: 1000
