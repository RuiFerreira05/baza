$kind: http-example
request:
  url: "{{baseUrl}}/v1/restricted/users/:username/events"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
  body:
    type: json
    content: |-
      {
        "title": "string",
        "date": "2008-09-10",
        "startTime": "1971-09-25T12:36:13.188Z",
        "endTime": "1974-04-08T09:47:45.548Z",
        "repeat": "day",
        "public": true,
        "description": "string",
        "location": "string"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "ERROR",
        "error": {
          "type": "ResourceCreationError",
          "message": "string"
        }
      }
    $type: |-
      {
        "description": "Error",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ERROR"
            ]
          },
          "error": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "ResourceCreationError"
                ]
              },
              "message": {
                "type": "string",
                "description": "A human readable error message"
              }
            },
            "required": [
              "type",
              "message"
            ]
          }
        },
        "required": [
          "status",
          "error"
        ]
      }
order: 3000
