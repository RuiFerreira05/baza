$kind: http-example
request:
  url: "{{baseUrl}}/v1/restricted/users/:username/events/:idEvent"
  method: PATCH
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
    idEvent: 535610ed-fcb7-e4e0-9c74-008a555da58a
  body:
    type: json
    content: |-
      {
        "title": "strin",
        "description": "string",
        "date": "1961-01-19",
        "location": "string",
        "startTime": "1954-01-22T17:26:20.231Z",
        "endTime": "1977-09-12T23:48:29.239Z",
        "repeat": "day",
        "public": false
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "OK",
        "data": {
          "id": "1y9889192bfb987",
          "username": "random_user123",
          "title": "Doctor Appointment",
          "description": "Annual checkup",
          "date": "1988-07-06",
          "location": "My house",
          "startTime": "1963-07-02T04:37:46.110Z",
          "endTime": "1986-01-22T16:45:49.029Z",
          "repeat": "string",
          "public": false,
          "createdAt": "1976-08-06T23:20:50.613Z",
          "updatedAt": "2002-01-11T23:09:45.296Z"
        }
      }
    $type: |-
      {
        "description": "Updated",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "OK"
            ]
          },
          "data": {
            "type": "object",
            "title": "PersonalEventDTO",
            "description": "Personal event data.",
            "properties": {
              "id": {
                "type": "string",
                "example": "1y9889192bfb987",
                "description": "event ID (randomly given)"
              },
              "username": {
                "type": "string",
                "example": "random_user123",
                "description": "username of user who this event belongs to"
              },
              "title": {
                "type": "string",
                "example": "Doctor Appointment",
                "description": "event title"
              },
              "description": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "event description",
                    "example": "Annual checkup"
                  },
                  {}
                ]
              },
              "date": {
                "type": "string",
                "description": "The date of the event ",
                "format": "date"
              },
              "location": {
                "anyOf": [
                  {
                    "type": "string",
                    "description": "location where the event is going to take place",
                    "example": "My house"
                  },
                  {}
                ]
              },
              "startTime": {
                "type": "string",
                "description": "start time of the event",
                "format": "date-time"
              },
              "endTime": {
                "type": "string",
                "description": "end time of the event",
                "format": "date-time"
              },
              "repeat": {
                "type": "string",
                "description": "frequency which an event should be repeated in the calendar. Can only be on of these: day, week, month, year, never"
              },
              "public": {
                "type": "boolean",
                "description": "expresses if an event should be public to the user's friends"
              },
              "createdAt": {
                "type": "string",
                "description": "The date and time when the event was created",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "description": "The date and time when the event was last updated",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "username",
              "title",
              "description",
              "date",
              "location",
              "startTime",
              "endTime",
              "repeat",
              "public",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "status",
          "data"
        ]
      }
order: 1000
