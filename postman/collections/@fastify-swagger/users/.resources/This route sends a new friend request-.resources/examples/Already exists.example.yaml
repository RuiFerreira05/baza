$kind: http-example
request:
  url: "{{baseUrl}}/v1/restricted/users/:username/friends/requests"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  pathVariables:
    username: string
  body:
    type: json
    content: |-
      {
        "recipientUsername": "string"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "ERROR",
        "error": {
          "type": "ExistingResourceError",
          "message": "string"
        }
      }
    $type: |-
      {
        "description": "Already exists",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ERROR"
            ]
          },
          "error": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "ExistingResourceError"
                ]
              },
              "message": {
                "type": "string",
                "description": "A human readable error message"
              }
            },
            "required": [
              "type",
              "message"
            ]
          }
        },
        "required": [
          "status",
          "error"
        ]
      }
order: 2000
