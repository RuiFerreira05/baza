$kind: http-request
name: This route creates a new personal event.
description: This route creates a new personal event.
url: "{{baseUrl}}/v1/restricted/users/:username/events"
method: POST
headers:
  Content-Type: application/json
  Accept: "*/*"
pathVariables:
  - key: username
    value: string
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string"
          }
        },
        "required": [
          "value"
        ]
      }
