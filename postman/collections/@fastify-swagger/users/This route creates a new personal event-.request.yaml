      "endTime": "1974-04-08T09:47:45.548Z",
      "repeat": "day",
      "public": true,
      "description": "string",
      "location": "string"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "title": {
          "type": "string",
          "minLength": 1,
          "maxLength": 64
