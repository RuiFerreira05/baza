        "description": {
          "type": "string"
        },
        "date": {
          "type": "string",
          "format": "date"
        },
        "location": {
          "type": "string"
        },
        "startTime": {
          "type": "string",
          "format": "date-time"
        },
        "endTime": {
          "type": "string",
          "format": "date-time"
        },
        "repeat": {
          "anyOf": [
            {
              "type": "string"
            },
            {
              "type": "string"
            },
            {
              "type": "string"
            },
            {
              "type": "string"
            },
            {
              "type": "string"
            }
          ]
        },
        "public": {
          "type": "boolean"
        }
      },
      "required": [
        "title",
        "date",
        "startTime",
        "endTime",
        "repeat",
        "public"
      ]
    }
examples: ./.resources/This route creates a new personal event-.resources/examples
