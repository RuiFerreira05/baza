$kind: http-example
name: if the group was created but there was an error converting it to the expected format before sending the response
request:
  url: "{{baseUrl}}/v1/restricted/groups/"
  method: POST
  headers:
    Content-Type: application/json
    Accept: "*/*"
  body:
    type: json
    content: |-
      {
        "groupName": "string"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: "*/*"
  body:
    type: text
    content: |-
      {
        "status": "ERROR",
        "error": {
          "type": "ConversionError",
          "message": "string"
        }
      }
    $type: |-
      {
        "description": "if the group was created but there was an error converting it to the expected format before sending the response",
        "type": "object",
        "properties": {
          "status": {
            "type": "string",
            "enum": [
              "ERROR"
            ]
          },
          "error": {
            "type": "object",
            "properties": {
              "type": {
                "type": "string",
                "enum": [
                  "ConversionError"
                ]
              },
              "message": {
                "type": "string",
                "description": "A human readable error message"
              }
            },
            "required": [
              "type",
              "message"
            ]
          }
        },
        "required": [
          "status",
          "error"
        ]
      }
order: 2000
